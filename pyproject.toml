[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minimax-agent"
version = "0.1.0"
description = "A Claude Code-style Python CLI coding agent powered by MiniMax Token Plan"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "chenye", email = "ccch713@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/ccch713/minimax-agent"
Repository = "https://github.com/ccch713/minimax-agent"
Documentation = "https://github.com/ccch713/minimax-agent#readme"
Changelog = "https://github.com/ccch713/minimax-agent/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
minimax-agent = "minimax_agent.cli:main"

[tool.setuptools.packages.find]
include = ["minimax_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = true
